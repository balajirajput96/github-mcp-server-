name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan tracked content for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Gitleaks against the checked-out tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_COMMAND: protect
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  token-pattern-check:
    name: Check common credential patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check for credential patterns outside approved examples
        shell: bash
        run: |
          set -euo pipefail
          excluded=(
            ':!*.md'
            ':!.github/workflows/*'
            ':!.env.example'
            ':!SECURITY.md'
            ':!test-security-validation.js'
            ':!tests/**'
          )
          if git grep -nE '(gh[pousrt]_[A-Za-z0-9_]{36,255}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[A-Za-z0-9]{24,32})' -- "${excluded[@]}"; then
            echo 'Credential pattern detected outside approved test/example files.' >&2
            exit 1
          fi
          echo 'No blocked credential patterns were found in tracked production files.'
